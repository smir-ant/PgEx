<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PgEx 01</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theory.css">
    <link rel="stylesheet" href="css/practice.css">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">

</head>

<body>


    <main>
        <nav>
            <a href="index.html" id="proj_name">PgEx</a>
            <div class="nav-controls">
                <button id="helpBtn" class="btn-icon" title="Help">?</button>
                <button id="langSwitcher" class="btn-text">EN/RU</button>
            </div>
        </nav>

        <section id="sect_theory">
            <h1 data-i18n="lesson01.title"></h1>
            <p data-i18n="lesson01.theory_p1"></p>

            <div class="code-example">
                <pre><code class="language-sql">SELECT column, another_column, …
FROM mytable;</code></pre>
                <div class="code-caption">
                    <label data-i18n="lesson01.code_example1_caption"></label>
                </div>
            </div>

            <p data-i18n="lesson01.theory_p2"></p>
            <p data-i18n="lesson01.theory_p3"></p>

            <div class="code-example">
                <pre><code class="language-sql">SELECT *
FROM mytable;</code></pre>
                <div class="code-caption">
                    <label data-i18n="lesson01.code_example2_caption"></label>
                </div>
            </div>
        </section>

        <hr>
        <section id="schema"></section>

        <section id="sect_practice">
            <div class="practice-left">
                <section id="group_table">
                    <div id="containerTable">
                        <table id="dataTable">
                            <thead></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="status"></div>
                </section>

                <section id="group_code" class="container">
                    <div class="code-editor">
                        <div id="colored" class="code-layer"></div>
                        <textarea id="sqlInput" class="code-layer" spellcheck="false"></textarea>
                    </div>
                </section>
            </div>

            <section id="group_task">
                <div class="container">
                    <h3 class="section-title" data-i18n="lesson01.tasks_title"></h3>
                    <ol></ol>
                </div>
                <a class="btn disabled" href="lesson02.html" id="finishBtn">Далее</a>
            </section>
        </section>
    </main>

    <script type="importmap">
    {
      "imports": {
        "pglite": "https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js"
      }
    }
    </script>

    <script src="scripts/isRightAns.js" defer></script>
    <script src="scripts/fillTableHtml.js" defer></script>
    <script src="scripts/status.js" defer></script>
    <script src="scripts/nextTask.js" defer></script>

    <script type="module">
        import { PgEx } from './scripts/core/PgEx.js';
        import lessonConfig from './scripts/lessons/lesson01.js';

        // Initialize the engine
        new PgEx(lessonConfig);
    </script>

    <script src="scripts/highlightSQL.js" defer></script>
</body>

</html>
