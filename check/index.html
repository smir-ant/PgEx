<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <button id="demo"
        style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px; font-size: 20px;">
        Celebrate!
    </button>

    <script src="confetti.min.js"></script>

    <script>
        // Pass in the id of an element
        let confetti = new Confetti('demo');

        // Edit given parameters
        confetti.setCount(75);
        confetti.setSize(1);
        confetti.setPower(60); // Increased power for shooting up
        confetti.setFade(false);
        confetti.destroyTarget(false); // Don't hide the button

        document.getElementById('demo').addEventListener('click', () => {
            // Shoot from bottom left
            confetti.fire(0, window.innerHeight);
            // Shoot from bottom right
            confetti.fire(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
