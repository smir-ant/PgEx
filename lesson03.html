<!DOCTYPE html>

<body>


    <main>
        <nav>
            <a href="index.html" id="proj_name">PgEx</a>
            <div class="nav-controls">
                <button id="helpBtn" class="btn-icon" title="Help">?</button>
                <button id="langSwitcher" class="btn-text">EN/RU</button>

        <section id="sect_theory">
            <h2 data-i18n="lesson03.title"></h2>

            <p data-i18n="lesson03.theory_intro"></p>

            <div class="code-example">
                <pre><code>SELECT * FROM employees WHERE department != 'HR';</code></pre>
                <div class="code-caption">
                    <label data-i18n="lesson03.code_example1_caption"></label>
                </div>
            </div>

            <p data-i18n="lesson03.theory_like"></p>

            <div class="code-example">
                <pre><code>SELECT * FROM employees WHERE name LIKE 'A%'; -- Starts with A
SELECT * FROM employees WHERE code LIKE '__-123'; -- Two chars, then -123</code></pre>
            </div>

            <p data-i18n="lesson03.theory_not_in"></p>

            <div class="code-example">
                <pre><code>SELECT * FROM employees WHERE id NOT IN (1, 2, 3);</code></pre>
            </div>

        </section>

                    <div class="code-editor">

                    </div>
                </section>
            </div>

            <section id="group_task">
                <div class="container">
                    <h3 class="section-title" data-i18n="lesson03.tasks_title"></h3>

        <section id="sect_faq">
            <details>
                <summary><span data-i18n="lesson01.faq.q1"></span></summary>
                <div>
                    <p data-i18n="lesson01.faq.a1"></p>
                </div>
            </details>
            <details>
                <summary><span data-i18n="lesson01.faq.q2"></span></summary>
                <div>
                    <p data-i18n="lesson01.faq.a2"></p>

            <details>

    <script type="importmap">
    {
      "imports": {
        "pglite": "https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js"
      }

    <script src="scripts/fillTableHtml.js" defer></script>
    <script src="scripts/status.js" defer></script>
    <script src="scripts/nextTask.js" defer></script>

    <script type="module">
        import { PgEx } from './scripts/core/PgEx.js';

        new PgEx(lessonConfig);
