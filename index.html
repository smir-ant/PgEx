<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PgEx</title>
	<link rel="icon" href="assets/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://cdn.jsdelivr.net">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/app.css">
	<script type="importmap">
	{
		"imports": {
			"@electric-sql/pglite": "https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.3.15/dist/index.js",
			"petite-vue": "https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.es.js"
		}
	}
	</script>
</head>
<body>
	<main v-cloak>
		<nav><a href="#/" class="logo">PgEx</a></nav>

		<!-- ====== HOME ====== -->
		<div v-if="page === 'home'">
			<h1>Уроки</h1>
			<a v-for="l in allLessons" :href="'#/lesson/' + l.slug" class="lesson-card">
				<h2>{{ l.title }}</h2>
				<span class="meta">{{ l.tasks.length }} заданий</span>
			</a>
		</div>

		<!-- ====== LESSON ====== -->
		<div v-if="page === 'lesson' && lesson">
			<section class="theory">
				<h1>{{ lesson.title }}</h1>
				<div v-html="theory"></div>
			</section>

			<hr>

			<!-- Schema -->
			<div class="schema">
				<figure v-for="t in lesson.schema" class="schema-block">
					<figcaption>{{ t.name }}</figcaption>
					<table class="schema-table"><tbody>
						<tr v-for="f in t.fields">
							<td class="field-name" :title="f.type">
								{{ f.name }}
								<span v-if="f.type.includes('PRIMARY KEY')" class="pk">PK</span>
							</td>
							<td>{{ f.desc }}</td>
						</tr>
					</tbody></table>
				</figure>
			</div>

			<!-- Practice -->
			<section class="practice">
				<div class="practice-left">
					<!-- Data Table -->
					<section class="tile">
						<div class="table-wrap">
							<table>
								<thead><tr><th v-for="f in fields">{{ f.name }}</th></tr></thead>
								<tbody>
									<tr v-for="row in rows">
										<td v-for="f in fields">{{ row[f.name] ?? '' }}</td>
									</tr>
								</tbody>
							</table>
						</div>
						<div class="status">{{ status }}</div>
					</section>

					<!-- Editor (mounted by JS — needs direct DOM control) -->
					<section class="tile editor-tile" id="editorMount"></section>
				</div>

				<!-- Tasks -->
				<div class="task-list">
					<h3>Задания</h3>
					<ol>
						<li v-for="(task, i) in lesson.tasks"
							:class="{ completed: i < taskIndex, active: i === taskIndex, disabled: i > taskIndex }">
							<span v-html="taskDesc(i)"></span>
							<button v-if="i === taskIndex" class="btn-solution"
								@click="showSolution(i)">Показать решение</button>
						</li>
					</ol>
				</div>
			</section>

			<hr v-if="lesson.next">
			<a v-if="lesson.next" :href="'#/lesson/' + lesson.next"
				class="btn" :class="{ disabled: taskIndex < lesson.tasks.length }">Далее</a>
		</div>

		<!-- 404 -->
		<div v-if="page === 'notfound'">
			<h1>Урок не найден</h1>
			<a href="#/">На главную</a>
		</div>
	</main>

	<script type="module" src="js/app.js"></script>
</body>
</html>
